# Table 1: generation time and constraint violation, per method and
# denoising resolution.
#
# Run with:
#   uv run -m cfm.cli sweep experiments/table1.toml
#   uv run -m cfm.cli table --format markdown
#
# Cases already in results/ are skipped; pass --force to re-run them.

num_samples = 20

# Rows: LDF with and without the final Gauss-Newton projection.
[[variants]]
name = "ldf"
method = "ldf"
label = "LDF (no projection)"
gains = { num_projection_iters = 0 }

[[variants]]
name = "ldf_projected"
method = "ldf"
label = "LDF + projection"
gains = { num_projection_iters = 2 }

# Unprojected, to compare against the `ldf` row.
[[variants]]
name = "penalty"
method = "penalty"
label = "Penalty only"
gains = { num_projection_iters = 0 }

# --- 2-D and MNIST, dt = 0.01 ---

[[block]]
problems = ["star", "mnist"]
problem_label = { star = "Star (eq.)" }
methods = ["pigdm", "pcfm", "penalty", "ldf", "ldf_projected"]
steps = [100]

# Shared by both LDF rows and the penalty ablation.
[[block.gains]]
method = ["ldf", "penalty"]
problem = "star"
penalty_weight = 5.0

[[block.gains]]
method = ["ldf", "penalty"]
problem = "mnist"
penalty_weight = 20.0

# --- Star with a right-half-plane inequality, dt = 0.01 ---

[[block]]
problems = ["star"]
problem_label = "Star (ineq.)"
methods = ["cbf", "penalty", "ldf", "ldf_projected"]
steps = [100]

[block.problem_options.star]
constraint = "right_half"

# Same weight as the equality star.
[[block.gains]]
method = ["ldf", "penalty"]
penalty_weight = 5.0

# --- Obstacle avoidance, sparse and crowded scenes, dt = 0.002 ---

[[block]]
problems = ["obstacles"]
problem_label = "Obstacles (2)"
methods = ["cbf", "penalty", "ldf", "ldf_projected"]
steps = [500]

[block.problem_options.obstacles]
num_obstacles = 2
scene_seed = 0

# The exact QP becomes infeasible at dt = 0.002.
[[block.gains]]
method = "cbf"
qp = "elastic"

[[block]]
problems = ["obstacles"]
problem_label = "Obstacles (6)"
methods = ["cbf", "penalty", "ldf", "ldf_projected"]
steps = [500]

[block.problem_options.obstacles]
num_obstacles = 6
scene_seed = 0

[[block.gains]]
method = "cbf"
qp = "elastic"

# --- D4RL locomotion with a roof constraint z + phi*vz <= h_r, dt = 0.01 ---

[[block]]
problems = ["walker2d", "hopper"]
problem_label = { walker2d = "Walker2D", hopper = "Hopper" }
methods = ["cbf", "penalty", "ldf", "ldf_projected"]
steps = [100]

# The exact QP fails part-way through a Hopper sweep.
[[block.gains]]
method = "cbf"
qp = "elastic"
