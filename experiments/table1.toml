# Table 1: generation time and constraint violation, per method and
# denoising resolution.
#
# Run with:
#   uv run -m cfm.cli sweep experiments/table1.toml
#   uv run -m cfm.cli table --format markdown
#
# Cases already recorded under results/ are skipped, so an interrupted sweep
# resumes. Pass --force to re-run them.

num_samples = 20

# Rows. A variant is a registered method with the gains that define its row
# pinned, so the same method can appear twice: LDF as the flow alone, and LDF
# followed by the Gauss-Newton projection that polishes off whatever
# violation the finite-time flow leaves behind. Pinning the iteration count
# here rather than inheriting it from the problem registry keeps the two rows
# meaning the same thing on every example.
[[variants]]
name = "ldf"
method = "ldf"
label = "LDF (no projection)"
gains = { num_projection_iters = 0 }

[[variants]]
name = "ldf_projected"
method = "ldf"
label = "LDF + projection"
gains = { num_projection_iters = 2 }

# The ablation is pinned unprojected too, so it is a comparison against the
# `ldf` row that isolates the dual dynamics rather than the final polish.
[[variants]]
name = "penalty"
method = "penalty"
label = "Penalty only"
gains = { num_projection_iters = 0 }

# ---------------------------------------------------------------------------
# The 2-D and MNIST rows, at dt = 0.01.
# ---------------------------------------------------------------------------

[[block]]
problems = ["star", "mnist"]
problem_label = { star = "Star (eq.)" }
methods = ["pigdm", "pcfm", "penalty", "ldf", "ldf_projected"]
steps = [100]

# Per-scenario penalty weights for the dual flow and its ablation. These were
# shell variables inside make_benchmark_table.sh, invisible to the figures.
# They are aimed at the method rather than the row, so both LDF rows and the
# ablation share a weight and the comparison isolates the dual dynamics and
# the projection instead of confounding them with a different gain.
[[block.gains]]
method = ["ldf", "penalty"]
problem = "star"
penalty_weight = 5.0

[[block.gains]]
method = ["ldf", "penalty"]
problem = "mnist"
penalty_weight = 20.0

# ---------------------------------------------------------------------------
# The star again, at the same resolution, but with the right-half-plane
# inequality in place of the unit-norm equality. This is the smallest example
# in the table where the CBF filter applies, so it is where the cost of the
# safety-filter QP can be read against the dual flow without the obstacle
# scene's hundreds of barrier rows in the way. The penalty-only ablation runs
# here too, through the same closed-form slack flow as LDF with the
# multipliers frozen at zero. PCFM and PiGDM are dropped from the block
# automatically, being equality-only.
# ---------------------------------------------------------------------------

[[block]]
problems = ["star"]
problem_label = "Star (ineq.)"
methods = ["cbf", "penalty", "ldf", "ldf_projected"]
steps = [100]

[block.problem_options.star]
constraint = "right_half"

# The same weight the equality rows use, so the two star blocks differ in the
# constraint and nothing else. The ablation shares it, as it does on the
# equality rows, so it isolates the dual dynamics.
[[block.gains]]
method = ["ldf", "penalty"]
penalty_weight = 5.0

# ---------------------------------------------------------------------------
# Obstacle avoidance, at dt = 0.002. Two scenes, sparse and crowded, so the
# table shows what happens as the constraints pile up. These are inequality
# constraints, so PCFM and PiGDM are dropped from the block automatically and
# the CBF filter, which handles nothing else, joins it. The penalty-only
# ablation runs here and on the locomotion rows too, at the penalty weight
# the problem registry gives LDF, so it isolates the dual dynamics.
# ---------------------------------------------------------------------------

[[block]]
problems = ["obstacles"]
problem_label = "Obstacles (2)"
methods = ["cbf", "penalty", "ldf", "ldf_projected"]
steps = [500]

[block.problem_options.obstacles]
num_obstacles = 2
scene_seed = 0

# The obstacles problem pins the exact QP, which at dt = 0.002 hits mutually
# infeasible barrier conditions and fails outright, leaving nothing to time.
# The elastic relaxation is what the comparison figure in plots.py runs at
# this step size for the same reason.
[[block.gains]]
method = "cbf"
qp = "elastic"

[[block]]
problems = ["obstacles"]
problem_label = "Obstacles (6)"
methods = ["cbf", "penalty", "ldf", "ldf_projected"]
steps = [500]

[block.problem_options.obstacles]
num_obstacles = 6
scene_seed = 0

[[block.gains]]
method = "cbf"
qp = "elastic"

# ---------------------------------------------------------------------------
# D4RL locomotion, at dt = 0.01. The same roof z + phi*vz <= h_r the example
# in the README enforces, on both environments, so the table says what the
# CBF filter and the dual flow each cost on a 32-step trajectory window with
# one barrier row per timestep. Inequalities again, so PCFM and PiGDM drop
# out and the CBF filter is in.
# ---------------------------------------------------------------------------

[[block]]
problems = ["walker2d", "hopper"]
problem_label = { walker2d = "Walker2D", hopper = "Hopper" }
methods = ["cbf", "penalty", "ldf", "ldf_projected"]
steps = [100]

# Pinned rather than inherited, to say in the config what the rows ran with.
# The rows of the roof residual have disjoint support, so the barrier
# conditions are feasible together on paper; in practice the exact solve
# still fails part-way through a Hopper sweep, and the relaxation is what
# the locomotion registry already pins for that reason.
[[block.gains]]
method = "cbf"
qp = "elastic"
