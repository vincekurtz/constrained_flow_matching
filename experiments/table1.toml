# Table 1: generation time and constraint violation, per method and
# denoising resolution.
#
# Run with:
#   uv run -m cfm.cli sweep experiments/table1.toml
#   uv run -m cfm.cli table --format markdown
#
# Cases already in results/ are skipped; pass --force to re-run them.

num_samples = 20

# Rows: LDF with and without the final Gauss-Newton projection.
[[variants]]
name = "ldf"
method = "ldf"
label = "LDF (no projection)"
gains = { num_projection_iters = 0 }

[[variants]]
name = "ldf_projected"
method = "ldf"
label = "LDF + projection"
gains = { num_projection_iters = 2 }

# Unprojected, to compare against the `ldf` row.
[[variants]]
name = "penalty"
method = "penalty"
label = "Penalty only"
gains = { num_projection_iters = 0 }

# Unprojected quadratic penalty c^2 ||g||^2 / (2 (1-t)^2).
# Fixed-step Midpoint, like LDF; numerical failures are retained.
[[variants]]
name = "time_varying_penalty"
method = "time_varying_penalty"
label = "Time-varying penalty"
gains = { throw = false }

# Baselines followed by LDF's final projection: the same 2 Gauss-Newton
# steps in normalized coordinates, timed as part of generation. PCFM and
# CBF already end with their own 20-step projections, so their rows are
# unchanged.
[[variants]]
name = "penalty_projected"
method = "penalty"
label = "Penalty + projection"
gains = { num_projection_iters = 2 }

[[variants]]
name = "time_varying_penalty_projected"
method = "time_varying_penalty"
label = "Time-varying penalty + projection"
gains = { throw = false, num_projection_iters = 2 }

[[variants]]
name = "pigdm_projected"
method = "pigdm"
label = "PiGDM + projection"
gains = { num_projection_iters = 2 }

[[variants]]
name = "opc_projected"
method = "opc"
label = "OPC + projection"
gains = { num_projection_iters = 2 }

[[variants]]
name = "dps_projected"
method = "dps"
label = "DPS + projection"
gains = { num_projection_iters = 2 }

# --- 2-D and MNIST, dt = 0.01 ---

[[block]]
problems = ["star", "mnist"]
problem_label = { star = "Star (eq.)" }
methods = ["pigdm", "pigdm_projected", "opc", "opc_projected", "dps",
           "dps_projected", "pcfm", "penalty", "penalty_projected",
           "time_varying_penalty", "time_varying_penalty_projected",
           "ldf", "ldf_projected"]
steps = [100]

# Shared by both LDF rows and the penalty ablation.
[[block.gains]]
method = ["ldf", "penalty", "time_varying_penalty"]
problem = "star"
penalty_weight = 5.0

[[block.gains]]
method = ["ldf", "penalty", "time_varying_penalty"]
problem = "mnist"
penalty_weight = 20.0

# OPC uses the variance table named in each problem's gains; build it
# with `uv run -m experiments.posterior_variance --problem <name>`.

# DPS step size zeta' (per-step, as in Chung et al.), chosen by mean
# violation on 200 star samples: a coarse grid {0.01, ..., 1} on seed 0,
# then {0.015, 0.02, 0.03, 0.05, 0.07} on seed 1.
[[block.gains]]
method = "dps"
problem = "star"
step_size = 0.03

# MNIST, same protocol: coarse grid {0.01, ..., 50} on seed 0 (violation
# falls until zeta' ~ 1, then grows), then {0.7, 1, 1.2, 1.5, 2} on seed 1.
[[block.gains]]
method = "dps"
problem = "mnist"
step_size = 1.0

# --- Star with a right-half-plane inequality, dt = 0.01 ---

[[block]]
problems = ["star"]
problem_label = "Star (ineq.)"
methods = ["cbf", "penalty", "penalty_projected", "time_varying_penalty",
           "time_varying_penalty_projected", "ldf", "ldf_projected"]
steps = [100]

[block.problem_options.star]
constraint = "right_half"

# Same weight as the equality star.
[[block.gains]]
method = ["ldf", "penalty", "time_varying_penalty"]
penalty_weight = 5.0

# --- Obstacle avoidance, sparse and crowded scenes, dt = 0.002 ---

[[block]]
problems = ["obstacles"]
problem_label = "Obstacles (2)"
methods = ["cbf", "penalty", "penalty_projected", "time_varying_penalty",
           "time_varying_penalty_projected", "ldf", "ldf_projected"]
steps = [500]

[block.problem_options.obstacles]
num_obstacles = 2
scene_seed = 0

# The exact QP becomes infeasible at dt = 0.002.
[[block.gains]]
method = "cbf"
qp = "elastic"

[[block]]
problems = ["obstacles"]
problem_label = "Obstacles (6)"
methods = ["cbf", "penalty", "penalty_projected", "time_varying_penalty",
           "time_varying_penalty_projected", "ldf", "ldf_projected"]
steps = [500]

[block.problem_options.obstacles]
num_obstacles = 6
scene_seed = 0

[[block.gains]]
method = "cbf"
qp = "elastic"

# --- D4RL locomotion with a roof constraint z + phi*vz <= h_r, dt = 0.01 ---

[[block]]
problems = ["walker2d", "hopper"]
problem_label = { walker2d = "Walker2D", hopper = "Hopper" }
methods = ["cbf", "penalty", "penalty_projected", "time_varying_penalty",
           "time_varying_penalty_projected", "ldf", "ldf_projected"]
steps = [100]

# The exact QP fails part-way through a Hopper sweep.
[[block.gains]]
method = "cbf"
qp = "elastic"
